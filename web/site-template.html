  <style>
    :root { --ink:#152d28; --muted:#65756f; --paper:#f7f8f4; --white:#fff; --line:#dce3dc; --green:#175b49; --pale:#e8f0e9; font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:var(--ink); background:var(--paper); font-synthesis:none; }
    * { box-sizing:border-box; } body { margin:0; } a { color:var(--green); text-underline-offset:.2em; } a:hover { text-decoration-thickness:2px; } button,input,select { font:inherit; } button,a,input,select,summary { -webkit-tap-highlight-color:transparent; } :focus-visible { outline:3px solid #ba6b2f; outline-offset:4px; }

    .hero { padding:58px 0 35px; display:flex; justify-content:space-between; align-items:end; gap:40px; } .eyebrow { margin:0 0 14px; color:var(--green); font-size:11px; font-weight:750; letter-spacing:.13em; text-transform:uppercase; } h1 { font-size:clamp(30px,4.2vw,47px); font-weight:650; letter-spacing:-.055em; line-height:1.1; margin:0 0 17px; max-width:850px; } .lede { color:var(--muted); font-size:16px; line-height:1.6; max-width:640px; margin:0; } .snapshot { flex-shrink:0; font-size:12px; color:var(--muted); line-height:1.8; text-align:right; } .snapshot strong { color:var(--ink); font-weight:550; display:block; }
