name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package and build tooling
        run: |
          python -m pip install --upgrade pip build
          python -m pip install --editable .

      - name: Check Python syntax
        run: python -m compileall -q semiconductor_atlas scripts tests web

      - name: Run core tests
        run: python -m unittest discover -s tests -v

      - name: Run web tests
        run: python -m unittest discover -s web/tests -v

      - name: Build distributions
        run: python -m build
