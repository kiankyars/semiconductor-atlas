name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package and build tooling
        run: |
          python -m pip install --upgrade pip build
          python -m pip install --editable .

      - name: Check Python syntax
        run: python -m compileall -q -x 'web/data/' semiconductor_atlas scripts tests web

      - name: Run core tests
        run: python -m unittest discover -s tests -v

      - name: Run web tests
        run: python -m unittest discover -s web/tests -v

      - name: Run evidence viewer client tests
        run: node --test web/tests/evidence_viewer_state.test.cjs

      - name: Build Semiconductor Atlas
        run: python web/build_site.py --output "$RUNNER_TEMP/semiconductor-site"

      - name: Build distributions
        run: python -m build
